<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}iBistro{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <style>
      body { background: #09090B; color: #fafafa; }
      .card { background: #18181B; }
      input, select, textarea {
        width: 100%;
        border-radius: 0.5rem;
        border: 1px solid #3f3f46;
        background: #09090B;
        color: #fafafa;
        padding: 0.45rem 0.7rem;
      }
      button.primary, a.primary { background: #FFC72C; color: #09090B; font-weight: 600; }
      button.primary:hover, a.primary:hover { background: #FEDD62; }
    </style>
  </head>
  <body class="min-h-screen bg-[#09090B] text-zinc-100">
    <main class="mx-auto max-w-3xl px-4 py-8">
      {% block content %}{% endblock %}
    </main>
    <script>
      document.body.addEventListener("htmx:beforeSwap", function (event) {
        var status = event.detail.xhr.status;
        if (status === 409 || status === 422 || status === 404) {
          event.detail.shouldSwap = true;
          event.detail.isError = false;
        }
      });
    </script>
  </body>
</html>
