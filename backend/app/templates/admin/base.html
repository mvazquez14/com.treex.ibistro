<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin · iBistro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
      body { background: #09090B; color: #fafafa; }
      .card { background: #18181B; }
      input, select, textarea {
        width: 100%;
        border-radius: 0.5rem;
        border: 1px solid #3f3f46;
        background: #09090B;
        color: #fafafa;
        padding: 0.45rem 0.7rem;
      }
      button.primary { background: #FFC72C; color: #09090B; font-weight: 600; }
      button.primary:hover { background: #FEDD62; }
    </style>
  </head>
  <body class="min-h-screen bg-[#09090B] text-zinc-100">
    <header class="border-b border-zinc-800">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
        <a href="/admin" class="text-xl font-semibold text-[#FFC72C]">iBistro Admin</a>
        <span class="text-sm text-zinc-400">Superusuario</span>
      </div>
    </header>
    <main class="mx-auto max-w-6xl px-4 py-6">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
