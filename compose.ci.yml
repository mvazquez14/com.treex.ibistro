# CI-only Postgres that mimics nuna-db on traefik-public.
# Not used in production; Nuna's compose stack owns that database server.
services:
  nuna-db:
    image: postgres:18
    container_name: nuna-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Variable not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Variable not set}
      POSTGRES_DB: ${POSTGRES_DB:?Variable not set}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
      start_period: 10s
      timeout: 5s
    networks:
      - traefik-public

  ensure-db:
    depends_on:
      nuna-db:
        condition: service_healthy

networks:
  traefik-public:
    name: traefik-public
    external: false
